<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acesso restrito</title>
<style>
:root { --bg: #f5f6f3; --fg: #1b211e; --muted: #5d6762; --line: #d9ddd8; --accent: #0d6b57; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #121614; --fg: #e8ece9; --muted: #9aa59f; --line: #2f3833; --accent: #5cc6a7; --bad: #f08a82; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", Arial, sans-serif; padding: 16px; }
form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
h1 { font-size: 1.3rem; margin: 0; }
p { margin: 0; color: var(--muted); }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
button { font: 600 15px "Segoe UI", Arial, sans-serif; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg); cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#erro { color: var(--bad); min-height: 1.5em; }
</style>
</head>
<body>
<form id="f">
  <h1>Acesso restrito</h1>
  <p>Digite a senha para abrir a página.</p>
  <label for="senha" style="position:absolute;left:-9999px">Senha</label>
  <input id="senha" type="password" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Abrir</button>
  <p id="erro" role="alert"></p>
</form>

async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bin(DADOS.s), iterations: DADOS.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(DADOS.i) }, chave, bin(DADOS.c));
  return new TextDecoder().decode(claro);
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const botao = document.getElementById("b"), erro = document.getElementById("erro");
  botao.disabled = true; botao.textContent = "Abrindo…"; erro.textContent = "";
  try {
    const html = await abrir(document.getElementById("senha").value);
    document.open(); document.write(html); document.close();
  } catch {
    erro.textContent = "Senha incorreta. Confira e tente de novo.";
    botao.disabled = false; botao.textContent = "Abrir";
  }
});
